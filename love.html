<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>nguyễn thành 9A4</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;}
  #stage{position:relative;width:100vw;height:100vh;background:#050308;}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
  #topbar{
    position:absolute;top:0;left:0;right:0;height:32px;z-index:5;
    background:linear-gradient(#3d3d3d,#232323);
    display:flex;align-items:center;padding:0 12px;gap:8px;
    box-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  #tabtitle{margin-left:8px;color:#cfcfcf;font-size:12px;opacity:.75;letter-spacing:.5px;}
  #hint{
    position:absolute;bottom:14px;left:0;right:0;text-align:center;
    color:#8a8a92;font-size:11px;letter-spacing:2px;z-index:5;
    text-shadow:0 0 6px rgba(255,105,180,.4);
  }
  #vignette{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <div class="dot" style="background:#ff5f56"></div>
    <div class="dot" style="background:#ffbd2e"></div>
    <div class="dot" style="background:#27c93f"></div>
    <span id="tabtitle">nguyễn thành 9A4</span>
  </div>
  <canvas id="rain"></canvas>
  <canvas id="fx"></canvas>
  <div id="vignette"></div>
  <div id="hint">I LOVE YOU</div>
</div>

  <div class="player">
  <button id="playBtn">▶︎</button>
  <span style="font-size:12px;opacity:.9">Website by Nguyen Thanh 9A4</span>
  <input type="file" id="pickFile" accept="audio/*">
  <button id="pickBtn">OPEN-FILE</button>
  <audio id="audio" loop autoplay preload="none">
    <source src="nhac4.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
/* ---------- Canvas setup ---------- */
const rainCanvas = document.getElementById('rain');
const rctx = rainCanvas.getContext('2d');
const fxCanvas = document.getElementById('fx');
const fctx = fxCanvas.getContext('2d');

let w, h, cols, fontSize = 16, drops = [];

function resizeAll(){
  w = rainCanvas.width = fxCanvas.width = window.innerWidth;
  h = rainCanvas.height = fxCanvas.height = window.innerHeight;
  cols = Math.floor(w / fontSize);
  drops = new Array(cols).fill(0).map(() => Math.random() * -60);
  rctx.fillStyle = '#050308';
  rctx.fillRect(0, 0, w, h);
}
window.addEventListener('resize', resizeAll);
resizeAll();

/* ---------- Matrix rain background ---------- */
const glyphSet = "01LOVEアイウエオカキクケコサシスセソ";

function drawRain(){
  rctx.fillStyle = 'rgba(5,3,8,0.16)';
  rctx.fillRect(0, 0, w, h);
  rctx.font = fontSize + 'px monospace';
  rctx.textAlign = 'left';
  rctx.textBaseline = 'alphabetic';

  for (let i = 0; i < cols; i++){
    const x = i * fontSize;
    const y = drops[i] * fontSize;
    const isHeart = Math.random() < 0.025;
    const ch = isHeart ? '♥' : glyphSet[Math.floor(Math.random() * glyphSet.length)];
    const pink = Math.random() < 0.6;

    rctx.shadowBlur = isHeart ? 6 : 0;
    rctx.shadowColor = '#ff5fa8';
    rctx.fillStyle = pink
      ? `rgba(255,90,170,${(0.45 + Math.random() * 0.5).toFixed(2)})`
      : `rgba(255,245,248,${(0.25 + Math.random() * 0.35).toFixed(2)})`;
    rctx.fillText(ch, x, y);

    if (y > h && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 0.55 + Math.random() * 0.35;
  }
  rctx.shadowBlur = 0;
}

/* ---------- Text / shape sampling ---------- */
function sampleText(text, { fontSize = 130, fontFamily = '"Arial Black", "Courier New", monospace', step = 5, cx = w / 2, cy = h / 2, weight = '900' } = {}){
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  octx.fillStyle = '#fff';
  octx.font = `${weight} ${fontSize}px ${fontFamily}`;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillText(text, cx, cy);
  const data = octx.getImageData(0, 0, off.width, off.height).data;
  const pts = [];
  for (let y = 0; y < off.height; y += step){
    for (let x = 0; x < off.width; x += step){
      if (data[(y * off.width + x) * 4 + 3] > 120) pts.push({ x, y });
    }
  }
  return pts;
}

function sampleHeart(cx, cy, size, step = 5){
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  octx.strokeStyle = '#fff';
  octx.lineWidth = size * 0.16;
  octx.lineJoin = 'round';
  octx.beginPath();
  for (let t = 0; t <= Math.PI * 2 + 0.02; t += 0.015){
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    const px = cx + (hx * size) / 16;
    const py = cy + (hy * size) / 16;
    if (t === 0) octx.moveTo(px, py); else octx.lineTo(px, py);
  }
  octx.closePath();
  octx.stroke();
  const data = octx.getImageData(0, 0, off.width, off.height).data;
  const pts = [];
  for (let y = 0; y < off.height; y += step){
    for (let x = 0; x < off.width; x += step){
      if (data[(y * off.width + x) * 4 + 3] > 120) pts.push({ x, y });
    }
  }
  return pts;
}

/* ---------- Particle system (falling-into-place text/shapes) ---------- */
const cellChars = "01LOVE";
function buildParticles(points, { color = '#f5f0dc', heart = false, glow = 14 } = {}){
  return points.map(p => ({
    tx: p.x, ty: p.y,
    x: p.x + (Math.random() - 0.5) * 6,
    y: -Math.random() * h - 30,
    vy: 8 + Math.random() * 14,
    ch: heart ? '♥' : cellChars[Math.floor(Math.random() * cellChars.length)],
    color,
    glow,
    landed: false,
    flicker: Math.random() * Math.PI * 2
  }));
}

let currentParticles = [];
let fadeAlpha = 1;

function renderFx(){
  fctx.clearRect(0, 0, w, h);
  fctx.font = 'bold 15px monospace';
  fctx.textAlign = 'center';
  fctx.textBaseline = 'middle';
  for (const p of currentParticles){
    if (!p.landed){
      p.y += p.vy;
      if (p.y >= p.ty){ p.y = p.ty; p.landed = true; }
    } else {
      p.flicker += 0.12;
    }
    const flick = p.landed ? 0.85 + 0.15 * Math.sin(p.flicker) : 1;
    fctx.globalAlpha = flick * fadeAlpha;
    fctx.fillStyle = p.color;
    fctx.shadowColor = p.color;
    fctx.shadowBlur = p.glow;
    // draw twice for a bolder, brighter look
    fctx.fillText(p.ch, p.x, p.y);
    fctx.fillText(p.ch, p.x, p.y);
  }
  fctx.globalAlpha = 1;
  fctx.shadowBlur = 0;
}

function loop(){
  drawRain();
  renderFx();
  requestAnimationFrame(loop);
}
loop();

/* ---------- Sequence controller ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fadeTo(target, ms){
  const start = fadeAlpha;
  const steps = Math.max(1, Math.round(ms / 16));
  for (let i = 1; i <= steps; i++){
    fadeAlpha = start + (target - start) * (i / steps);
    await sleep(16);
  }
  fadeAlpha = target;
}

async function showText(text, opts = {}){
  currentParticles = buildParticles(sampleText(text, opts), { color: opts.color || '#f5f0dc' });
  await fadeTo(1, 180);
}

async function showHeart(){
  const cx = w / 2, cy = h / 2 - h * 0.06;
  const size = Math.min(w, h) * 0.4;
  const heartPts = sampleHeart(cx, cy, size, 5);
  const heartParticles = buildParticles(heartPts, { color: '#ff4fa3', heart: true, glow: 14 });

  const msgPts = sampleText('I LOVE YOU', {
    fontSize: Math.max(30, Math.min(w, h) * 0.075),
    step: 3,
    weight: '900',
    cx, cy: cy + size * 0.08
  });
  const msgParticles = buildParticles(msgPts, { color: '#ffd400', glow: 4 });

  currentParticles = heartParticles.concat(msgParticles);
  await fadeTo(1, 250);
}

async function runSequence(){
  while (true){
    for (const n of ['3', '2', '1']){
      await showText(n, { fontSize: Math.min(w, h) * 0.38, step: 4, weight: '900', color: '#fff6e5' });
      await sleep(600);
      await fadeTo(0, 300);
      await sleep(120);
    }
    for (const word of ['You', 'Are', 'My', 'Love','because']){
      await showText(word, { fontSize: Math.min(w, h) * 0.19, step: 4, weight: '900', color: '#fff6e5' });
      await sleep(700);
      await fadeTo(0, 300);
      await sleep(120);
    }
    await showHeart();
    await sleep(3200);
    await fadeTo(0, 600);
    await sleep(600);
  }
}
runSequence();
</script>
</body>
</html>
